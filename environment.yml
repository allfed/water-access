# Conda environment for water-access (ADR-6).
#
# Python 3.9 / pandas 1.4.3 (the previous pins) are EOL and cannot supply the
# rasterio/geopandas versions the 30 arc-second extraction pipeline needs. The
# model is validated on Python 3.11+ / pandas 2.x.
#
#     conda env create -f environment.yml
#     conda activate water-access
#     pip install -e .
#
# A plain pip/uv path is also supported -- see requirements.txt.
#
# pandas is capped below 3.0 deliberately: only the pandas 2.x semantics have
# been validated (109/109 tests green). Lift the cap only after re-running the
# suite and the AC-5 regression gate against results/regression_baseline/.
#
# Removed relative to the 3.9 environment: dash, jupyter-dash, jupyterlab-dash,
# Flask, pyinterpolate, weightedstats, chart_studio, countryinfo, python-dotenv.
# None of them are imported anywhere in src/, scripts/ or tests/, and several no
# longer install on Python 3.11+.
name: water-access
channels:
  - conda-forge
dependencies:
  - python>=3.11
  # core numerics
  - numpy>=1.26
  - pandas>=2.1,<3.0
  - scipy>=1.11
  # IO
  - pyarrow>=14.0
  - openpyxl>=3.1
  # GIS / raster extraction
  - rasterio>=1.3
  - geopandas>=0.14
  - shapely>=2.0
  - pyproj>=3.6
  # analysis / plotting
  - matplotlib>=3.8
  - seaborn>=0.13
  - scikit-learn>=1.3
  - pycountry>=23.12
  - tqdm>=4.66
  # notebooks
  - ipykernel>=6.29
  - ipywidgets>=8.1
  - notebook>=7.0
  # dev / test
  - pytest>=8.0
  - pytest-mock>=3.12
  - black>=24.0
  - pip
  - pip:
      - plotly>=5.18
      - kaleido>=0.2.1
